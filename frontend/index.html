<!doctype html>
<html lang="ar-SA" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#151A18" />
    <style>
      html { background: var(--bg, #151a18); color-scheme: dark; }
      html[data-theme="light"] { background: var(--bg, #f4f1e8); color-scheme: light; }
    </style>
    <script>
      // Presentation only, before deferred modules and the first paint.
      (() => {
        try {
          const root = document.documentElement;
          root.dataset.theme = localStorage.getItem('changeflow_theme') === 'light' ? 'light' : 'dark';
          root.lang = localStorage.getItem('changeflow_language') === 'en' ? 'en' : 'ar-SA';
          root.dir = root.lang === 'ar-SA' ? 'rtl' : 'ltr';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', root.dataset.theme === 'light' ? '#F4F1E8' : '#151A18');
        } catch { /* Default Arabic/dark remains usable when storage is blocked. */ }
      })();
    </script>
    <title>ChangeFlow — حوكمة التغيير</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
